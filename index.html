<style>

    --ink:#4A3B5C;
    --indigo:#8B7FD6;
    --indigo-dark:#5B4B8A;

    --gold:#FFC65C;

    --muted:#A498B5;

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F2ECDD; --indigo:#B3A6F0; --indigo-dark:#2A2340; --madder:#FF9FBB; --gold:#FFD37A; --leaf:#7EE8C4;
      --bg:#231C34; --panel:#2E2645; --line:#453A63; --muted:#B8ADCF; --good:#7EE8C4;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F2ECDD; --indigo:#B3A6F0; --indigo-dark:#2A2340; --madder:#FF9FBB; --gold:#FFD37A; --leaf:#7EE8C4;
    --bg:#231C34; --panel:#2E2645; --line:#453A63; --muted:#B8ADCF; --good:#7EE8C4;

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito','Quicksand',sans-serif; }
  .app { display:flex; min-height:100vh; }

  .side {
    width:230px; flex-shrink:0; color:#4A3B5C;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.55) 0, transparent 55%),
      radial-gradient(circle at 85% 70%, rgba(255,255,255,.35) 0, transparent 45%),

  .brand { font-family:'Fredoka','Quicksand',sans-serif; font-weight:700; font-size:23px; padding:26px 20px 18px; border-bottom:2px dashed rgba(74,59,92,.18); color:#6B4C8A; letter-spacing:.01em; }
  .brand small { display:block; font-family:'Quicksand',sans-serif; font-weight:600; font-size:11px; color:#9A7CB0; margin-top:4px; letter-spacing:.02em; }

  .toprow { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:30px; }
  .stat { background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:0 8px 18px -12px rgba(255,122,162,.35); transition:transform .15s ease; }
  .stat:hover { transform:translateY(-3px); }
  .stat::before {
    content:""; flex-shrink:0; width:42px; height:42px; border-radius:14px;
    background:linear-gradient(135deg, var(--madder), var(--gold));

  .stat:nth-of-type(4n+2)::before{ background:linear-gradient(135deg, var(--indigo), var(--madder)); }
  .stat:nth-of-type(4n+3)::before{ background:linear-gradient(135deg, var(--gold), var(--leaf)); }
  .stat:nth-of-type(4n+4)::before{ background:linear-gradient(135deg, var(--leaf), var(--indigo)); }
  .stat .label { font-size:11.5px; color:var(--muted); margin-bottom:5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }

  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(255,122,162,.06); }

  .btn { border:2px solid var(--line); background:var(--panel); color:var(--ink); border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; transition:transform .1s ease; }

  .btn.gold { background:linear-gradient(135deg, var(--gold), var(--madder)); border-color:transparent; color:#fff; }

  input, select { border:2px solid var(--line); border-radius:14px; padding:8px 13px; font-size:13.5px; font-family:'Nunito',sans-serif; background:var(--panel); color:var(--ink); width:100%; }
  input:focus, select:focus { outline:none; border-color:var(--madder); box-shadow:0 0 0 3px rgba(255,122,162,.18); }
  label.field { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); font-weight:700; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .modal { background:var(--panel); border-radius:26px; padding:24px; width:440px; max-width:100%; max-height:88vh; overflow-y:auto; display:flex; flex-direction:column; gap:12px; box-shadow:0 24px 60px -20px rgba(91,58,115,.45); }

  .empty { padding:30px; text-align:center; color:var(--muted); font-size:13.5px; }
  .badge { font-size:11px; padding:4px 12px; border-radius:999px; display:inline-block; font-weight:800; letter-spacing:.01em; }

  .note { font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.5; }

  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:6px; }

  .mobile-topbar { display:none; }
  @media (max-width: 780px){
    .mobile-topbar {
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      background:linear-gradient(120deg, #FFD9E8, #D9CCFB);

    .hamburger-btn { background:#FFFFFF; border:none; border-radius:10px; width:38px; height:38px; font-size:18px; cursor:pointer; color:#4A3B5C; flex-shrink:0; }
    .mobile-brand { font-family:'Fredoka','Quicksand',sans-serif; font-weight:700; font-size:18px; color:#4A3B5C; }
    .app { flex-direction:column; position:relative; }
    .side {

    .toprow { flex-wrap:wrap; gap:10px; }
    h1 { font-size:21px; }
    .stats { grid-template-columns:repeat(2,1fr); gap:10px; }
    .stat { padding:12px 14px; }
    .stat .value { font-size:18px; }
    .panel { overflow-x:auto; }
    table { font-size:12.5px; min-width:600px; }
    .modal { width:100%; }
    .grid2, .grid3 { grid-template-columns:1fr; }

</style>

<script>
// ===================== SUPABASE SETUP =====================
const SUPABASE_URL = "https://egggusqlrmqmwfeirxfc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dC8sA9HKq2MP-9YlRVMEEA_PkJ1737S";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SIZES = ["S","M","L","XL","XXL","3XL"];
const WAIT_THRESHOLD = 10;
const LOCATIONS = ["Office","Printer","Karigar","Press","Packed Stock","Marketplace Warehouse"];

const TABLES = {
  material: "materials", design: "designs", printing: "printing", cutting: "cutting",
  karigar: "karigars", batch: "batches", karigarpayment: "karigar_payments",
  press: "press", dispatch: "dispatches", staff: "staff", staffpayment: "staff_payments",
  fabrictype: "fabric_types", supplier: "suppliers", supplierpayment: "supplier_payments",
  return: "returns"
};
const STATE_KEY = {
  material: "materials", design: "designs", printing: "printing", cutting: "cutting",
  karigar: "karigars", batch: "batches", karigarpayment: "karigarPayments",
  press: "press", dispatch: "dispatches", staff: "staff", staffpayment: "staffPayments",
  fabrictype: "fabricTypes", supplier: "suppliers", supplierpayment: "supplierPayments",
  return: "returns"
};

function toCamelKey(k){ return k.replace(/_([a-z0-9])/g, (_,c)=>c.toUpperCase()); }
function toSnakeKey(k){ return k.replace(/[A-Z]/g, c=>'_'+c.toLowerCase()); }
function rowToCamel(row){
  if (!row) return row;
  const out = {};
  for (const k in row) out[toCamelKey(k)] = row[k];
  return out;
}
function objToSnake(obj){
  const out = {};
  for (const k in obj){
    let v = obj[k];
    if (v === "") v = null;
    out[toSnakeKey(k)] = v;
  }
  return out;
}

async function dbInsert(kind, obj){
  const table = TABLES[kind];
  const { data, error } = await sb.from(table).insert(objToSnake(obj)).select().single();
  if (error) throw error;
  return rowToCamel(data);
}
async function dbUpdate(kind, id, obj){
  const table = TABLES[kind];
  const { data, error } = await sb.from(table).update(objToSnake(obj)).eq('id', id).select().single();
  if (error) throw error;
  return rowToCamel(data);
}
async function dbDelete(kind, id){
  const table = TABLES[kind];
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) throw error;
}
async function dbCancel(kind, id){
  return dbUpdate(kind, id, { cancelled: true, cancelledAt: new Date().toISOString() });
}

// ===================== APP STATE =====================
let state = { materials:[], designs:[], cutting:[], karigars:[], batches:[], press:[], printing:[], dispatches:[], staff:[], staffPayments:[], karigarPayments:[], fabricTypes: [], suppliers: [], supplierPayments: [], returns: [] };
let currentUser = null;
let currentRole = "employee";
let loginError = "";
let activeTab = "dashboard";
let modal = null; // {type, data}

function setTab(t){ activeTab = t; mobileMenuOpen = false; render(); }
function openModal(type, data){ modal = {type, data}; render(); }
function closeModal(){ modal = null; render(); }

// ---------- derived helpers (unchanged business logic) ----------
function goodQtyFor(designId, component){
  return state.batches
    .filter(b => b.designId === designId && b.component === component && !b.cancelled)
    .reduce((sum,b) => sum + Math.max(0,(b.receivedQty||0) - (b.notOkQty||0)), 0);
}
function waitingPool(design){
  if (!design.components || design.components.length < 2) return [];
  const goods = design.components.map(c => ({ name:c.name, qty: goodQtyFor(design.id, c.name) }));
  const minQty = Math.min(...goods.map(g=>g.qty));
  return goods.map(g => ({ name:g.name, waiting: g.qty - minQty })).filter(g=>g.waiting>0);
}
function totalEarned(karigarId){
  return state.batches
    .filter(b => b.karigarId === karigarId && !b.cancelled)
    .reduce((sum,b)=>{
      const karigar = state.karigars.find(k=>k.id===karigarId);
      const rate = karigar ? karigar.rate : 0;
      const good = Math.max(0,(b.receivedQty||0)-(b.notOkQty||0));
      return sum + good*rate;
    },0);
}
function totalPaidToKarigar(karigarId){
  return state.karigarPayments.filter(p=>p.karigarId===karigarId && !p.cancelled).reduce((s,p)=>s+Number(p.amount||0),0);
}
function paymentDue(karigarId){
  const k = state.karigars.find(x=>x.id===karigarId);
  const advance = k ? Number(k.advance||0) : 0;
  return totalEarned(karigarId) - totalPaidToKarigar(karigarId) - advance;
}

// ---------- suppliers ----------
function totalPurchasedFromSupplier(supplierId){
  return state.materials.filter(m=>m.supplierId===supplierId).reduce((sum,m)=>{
    const qty = m.type==="Fabric" ? Number(m.billedQty||0) : Number(m.qty||0);
    return sum + qty*Number(m.rate||0);
  },0);
}
function totalPaidToSupplier(supplierId){
  return state.supplierPayments.filter(p=>p.supplierId===supplierId && !p.cancelled).reduce((s,p)=>s+Number(p.amount||0),0);
}
function supplierBalanceDue(supplierId){
  return totalPurchasedFromSupplier(supplierId) - totalPaidToSupplier(supplierId);
}

// ---------- karigar performance (basic, from real batch data) ----------
function karigarPerformance(karigarId){
  const batches = state.batches.filter(b=>b.karigarId===karigarId && !b.cancelled && Number(b.receivedQty||0)>0);
  const totalReceived = batches.reduce((s,b)=>s+Number(b.receivedQty||0),0);
  const totalNotOk = batches.reduce((s,b)=>s+Number(b.notOkQty||0),0);
  const totalGood = totalReceived - totalNotOk;
  const goodPct = totalReceived>0 ? (totalGood/totalReceived*100) : null;
  const rejectPct = totalReceived>0 ? (totalNotOk/totalReceived*100) : null;
  return { totalReceived, totalNotOk, totalGood, goodPct, rejectPct };
}

// ---------- returns / RTO ----------
function restockedQtyForDesign(designId){
  return state.returns.filter(r=>r.designId===designId && !r.cancelled && r.resolution==="restock").reduce((s,r)=>s+Number(r.qty||0),0);
}

function getFabricTypeForMaterial(materialId){
  const m = state.materials.find(x=>x.id===materialId);
  if (!m) return null;
  return state.fabricTypes.find(f=>f.id===m.fabricTypeId) || null;
}
function computeShrinkage(materialId, sentQty, returnedQty){
  sentQty = Number(sentQty)||0; returnedQty = Number(returnedQty)||0;
  if (sentQty<=0) return null;
  const ft = getFabricTypeForMaterial(materialId);
  const standardPct = ft ? ft.standardShrinkagePercent : 0;
  const actualPct = ((sentQty-returnedQty)/sentQty)*100;
  const variancePct = standardPct - actualPct;
  const varianceMeters = sentQty*variancePct/100;
  const mat = state.materials.find(x=>x.id===materialId);
  const rate = mat && mat.rate ? Number(mat.rate) : null;
  const settlementAmount = rate!=null ? Math.abs(varianceMeters)*rate : null;
  let owedBy = "none";
  if (variancePct > 0.05) owedBy = "business";
  else if (variancePct < -0.05) owedBy = "printer";
  return { standardPct, actualPct, variancePct, varianceMeters, settlementAmount, owedBy };
}

function stitchingCostPerPiece(designId){
  const relevant = state.batches.filter(b=>b.designId===designId && !b.cancelled);
  let totalCost = 0, totalGood = 0;
  relevant.forEach(b=>{
    const k = state.karigars.find(x=>x.id===b.karigarId);
    const rate = k ? Number(k.rate)||0 : 0;
    const good = Math.max(0,(b.receivedQty||0)-(b.notOkQty||0));
    totalCost += good*rate; totalGood += good;
  });
  return totalGood>0 ? totalCost/totalGood : null;
}
function designProfitability(d){
  const stitch = stitchingCostPerPiece(d.id);
  const fabric = Number(d.fabricCostPerPiece)||0;
  const printing = Number(d.printingCostPerPiece)||0;
  const pressPack = Number(d.pressPackCostPerPiece)||0;
  const commissionPct = Number(d.commissionPercent)||0;
  const costPerPiece = fabric + printing + pressPack + (stitch||0);
  const hasStitchData = stitch!=null;
  function channelProfit(price, isUSD){
    if (!price) return null;
    const commission = price * commissionPct/100;
    const profit = price - commission - costPerPiece;
    const marginPct = price>0 ? (profit/price*100) : null;
    return { price, commission, profit, marginPct };
  }
  return {
    costPerPiece, hasStitchData, stitch, fabric, printing, pressPack, commissionPct,
    in: channelProfit(Number(d.priceIn)||0), com: channelProfit(Number(d.priceCom)||0), myntra: channelProfit(Number(d.priceMyntra)||0)
  };
}

function journeyFor(designId){
  const printingEntries = state.printing.filter(p=>p.designId===designId && !p.cancelled);
  const printSent = printingEntries.reduce((s,p)=>s+Number(p.sentQty||0),0);
  const printReturned = printingEntries.reduce((s,p)=>s+Number(p.returnedQty||0),0);
  const cuttingEntries = state.cutting.filter(c=>c.designId===designId);
  const totalCutPieces = cuttingEntries.reduce((s,c)=>s+Number(c.totalPieces||0),0);
  const totalMeterUsed = cuttingEntries.reduce((s,c)=>s+Number(c.meterUsed||0),0);
  const batchEntries = state.batches.filter(b=>b.designId===designId && !b.cancelled);
  const givenToKarigar = batchEntries.reduce((s,b)=>s+Number(b.givenQty||0),0);
  const receivedFromKarigar = batchEntries.reduce((s,b)=>s+Number(b.receivedQty||0),0);
  const notOk = batchEntries.reduce((s,b)=>s+Number(b.notOkQty||0),0);
  const pressEntries = state.press.filter(p=>p.designId===designId && !p.cancelled);
  const pressSent = pressEntries.reduce((s,p)=>s+Number(p.sentQty||0),0);
  const pressReturned = pressEntries.reduce((s,p)=>s+Number(p.returnedQty||0),0);
  const dispatchEntries = state.dispatches.filter(d=>d.designId===designId && !d.cancelled);
  const dispatched = dispatchEntries.reduce((s,d)=>s+Number(d.qty||0),0);
  return {
    printSent, printReturned, pendingAtPrinter: printSent-printReturned,
    totalCutPieces, totalMeterUsed,
    givenToKarigar, receivedFromKarigar, notOk, pendingWithKarigar: givenToKarigar-receivedFromKarigar,
    pressSent, pressReturned, pendingAtPress: pressSent-pressReturned,
    dispatched, readyToDispatch: Math.max(0, pressReturned-dispatched)
  };
}

function reverseFabricNeeded(component, numPieces){
  const ft = state.fabricTypes.find(f=>f.id===component.fabricTypeId);
  const avg = Number(component.avgConsumption)||0;
  const usable = numPieces*avg;
  const rejPct = Number(component.cuttingRejectionPercent)||0;
  const afterRejection = rejPct<100 ? usable/(1-rejPct/100) : usable;
  const shrinkPct = ft ? ft.standardShrinkagePercent : 0;
  const afterShrink = shrinkPct<100 ? afterRejection/(1-shrinkPct/100) : afterRejection;
  const foldPct = ft ? ft.foldPercent : 100;
  const billedNeeded = foldPct>0 ? afterShrink/(foldPct/100) : afterShrink;
  return { usable, afterRejection, afterShrink, billedNeeded, fabricTypeName: ft?ft.name:"— (set fabric type on this component)" };
}

// ---------- render ----------
let mobileMenuOpen = false;
function render(){
  const root = document.getElementById("root");
  root.innerHTML = `
    <div class="mobile-topbar">
      <button class="hamburger-btn" id="btn-hamburger">☰</button>
      <div class="mobile-brand">🌸 Aradhika</div>
    </div>
    ${mobileMenuOpen ? '<div class="mobile-backdrop" id="mobile-backdrop"></div>' : ''}
    <div class="app">
      <div class="side ${mobileMenuOpen ? 'mobile-open' : ''}">
        <div class="brand">🌸 Aradhika<small>Production &amp; stock manager</small></div>
        ${navItem("dashboard","🏠 Dashboard")}
        ${navItem("designs","🧵 Designs")}
        ${navItem("materials","📦 Materials")}
        ${navItem("printing","🎨 Printing")}
        ${navItem("cutting","✂️ Cutting")}
        ${navItem("karigar","🧑‍🔧 Karigar")}
        ${navItem("press","🧺 Press &amp; Packing")}
        ${navItem("stock","📊 Stock")}
        ${currentRole==="owner" ? navItem("suppliers","🏬 Suppliers (owner only)") : ""}
        ${navItem("returns","↩️ Returns / RTO")}
        ${currentRole==="owner" ? navItem("accounts","💰 Accounts (owner only)") : ""}
        ${currentRole==="owner" ? navItem("auditlog","📜 Audit Log (owner only)") : ""}
        <div class="side-footer">
          Logged in: ${currentUser?currentUser.email:""}<br>Role: ${currentRole}
          <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
            ${currentRole==="owner" ? '<button class="btn small" id="btn-export-excel" style="width:100%">⬇ Export to Excel</button>' : ''}
            ${currentRole==="owner" ? '<button class="btn small" id="btn-backup" style="width:100%">⬇ Backup data (JSON)</button>' : ''}
            <button class="btn small" id="btn-signout" style="width:100%">Sign out</button>
          </div>
        </div>
      </div>
      <div class="main"><div class="main-inner">${renderTab()}</div></div>
    </div>
    ${modal ? renderModal() : ""}
  `;
  attachHandlers();
}
function navItem(key,label){
  return `<div class="nav-item ${activeTab===key?'active':''}" data-nav="${key}">${label}</div>`;
}

function renderTab(){
  if ((activeTab==="accounts"||activeTab==="auditlog"||activeTab==="suppliers") && currentRole!=="owner") activeTab = "dashboard";
  if (activeTab==="dashboard") return renderDashboard();
  if (activeTab==="materials") return renderMaterials();
  if (activeTab==="printing") return renderPrinting();
  if (activeTab==="designs") return renderDesigns();
  if (activeTab==="cutting") return renderCutting();
  if (activeTab==="karigar") return renderKarigar();
  if (activeTab==="press") return renderPress();
  if (activeTab==="stock") return renderStock();
  if (activeTab==="suppliers") return renderSuppliers();
  if (activeTab==="returns") return renderReturns();
  if (activeTab==="accounts") return renderAccounts();
  if (activeTab==="auditlog") return renderAuditLog();
  return "";
}

// ---------- Dashboard ----------
function renderDashboard(){
  const lowMaterials = state.materials.filter(m => Number(m.qty) <= Number(m.lowAt||0));
  const waitAlerts = [];
  state.designs.forEach(d=>{
    waitingPool(d).forEach(w=>{
      if (w.waiting >= WAIT_THRESHOLD) waitAlerts.push({design:d.name, component:w.name, waiting:w.waiting});
    });
  });
  const today = new Date().toISOString().slice(0,10);
  const overdueBatches = state.batches.filter(b => b.expectedReturnDate && b.expectedReturnDate < today && Number(b.receivedQty||0) < Number(b.givenQty||0));
  const overduePress = state.press.filter(p => p.expectedReturnDate && p.expectedReturnDate < today && Number(p.returnedQty||0) < Number(p.sentQty||0));
  const pendingKarigarPieces = state.batches.reduce((sum,b)=> sum + Math.max(0,(b.givenQty||0)-(b.receivedQty||0)),0);
  const totalPaymentDue = state.karigars.reduce((sum,k)=> sum + paymentDue(k.id), 0);

  return `
    <h1>Dashboard</h1>
    <div class="stats">
      <div class="stat"><div class="label">Designs</div><div class="value">${state.designs.length}</div></div>
      <div class="stat"><div class="label">Karigars</div><div class="value">${state.karigars.length}</div></div>
      <div class="stat"><div class="label">Pieces pending with karigars</div><div class="value">${pendingKarigarPieces}</div></div>
      <div class="stat"><div class="label">Total payment due</div><div class="value mono">₹${totalPaymentDue.toFixed(0)}</div></div>
    </div>

    <h2>Overdue — karigar</h2>
    <div class="panel">
      ${overdueBatches.length===0 ? `<div class="empty">No karigar batches overdue.</div>` :
        `<table><tr><th>Batch</th><th>Karigar</th><th>Expected by</th><th>Pending pieces</th></tr>
        ${overdueBatches.map(b=>{
          const k = state.karigars.find(x=>x.id===b.karigarId);
          return `<tr><td class="mono">${b.batchLabel}</td><td>${k?k.name:"—"}</td><td>${b.expectedReturnDate}</td><td class="mono">${Number(b.givenQty||0)-Number(b.receivedQty||0)}</td></tr>`;
        }).join("")}
        </table>`}
    </div>

    <h2>Overdue — press</h2>
    <div class="panel">
      ${overduePress.length===0 ? `<div class="empty">No press entries overdue.</div>` :
        `<table><tr><th>Design</th><th>Sent date</th><th>Expected by</th><th>Pending pieces</th></tr>
        ${overduePress.map(p=>{
          const d = state.designs.find(x=>x.id===p.designId);
          return `<tr><td>${d?d.code:"—"}</td><td>${p.date}</td><td>${p.expectedReturnDate}</td><td class="mono">${Number(p.sentQty||0)-Number(p.returnedQty||0)}</td></tr>`;
        }).join("")}
        </table>`}
    </div>

    <h2>Low material stock</h2>
    <div class="panel">
      ${lowMaterials.length===0 ? `<div class="empty">Nothing running low.</div>` :
        `<table><tr><th>Material</th><th>Qty left</th><th>Unit</th></tr>
        ${lowMaterials.map(m=>`<tr><td>${m.name}</td><td class="mono">${m.qty}</td><td>${m.unit}</td></tr>`).join("")}
        </table>`}
    </div>

    <h2>Waiting-for-match — needs cutting (10+ pending)</h2>
    <div class="panel">
      ${waitAlerts.length===0 ? `<div class="empty">No component backlog above the threshold.</div>` :
        `<table><tr><th>Design</th><th>Component</th><th>Waiting</th><th></th></tr>
        ${waitAlerts.map(w=>`<tr><td>${w.design}</td><td>${w.component}</td><td class="mono">${w.waiting}</td><td><span class="badge wait">Ask master ji to cut ${w.component}</span></td></tr>`).join("")}
        </table>`}
    </div>
  `;
}

// ---------- Printing ----------
function renderPrinting(){
  return `
    <div class="toprow"><h1>Printing</h1><button class="btn primary" data-open="printing-new">Send fabric to printer</button></div>
    <p class="note">Use this only when raw fabric goes out for printing. If ready printed/pre-shrunk fabric arrives directly from a supplier, log it straight in Materials instead — this stage is skipped for that fabric.</p>
    <div class="panel">
      ${state.printing.filter(p=>!p.cancelled).length===0 ? `<div class="empty">No fabric sent for printing yet.</div>` :
      `<table>
        <tr><th>Sent date</th><th>Fabric</th><th>Printer</th><th>Sent (m)</th><th>Returned (m)</th><th>Shrinkage (actual / standard)</th><th>Settlement</th><th>Print issue (m)</th><th>Damage (m)</th><th>Status</th><th></th></tr>
        ${state.printing.filter(p=>!p.cancelled).map(p=>{
          const m = state.materials.find(x=>x.id===p.materialId);
          const done = p.returnedQty && Number(p.returnedQty) > 0;
          const calc = done ? computeShrinkage(p.materialId, p.sentQty, p.returnedQty) : null;
          let settlementText = "—";
          if (calc && calc.owedBy!=="none"){
            const who = calc.owedBy==="business" ? "We owe printer" : "Printer owes us";
            settlementText = calc.settlementAmount!=null ? `${who} ₹${calc.settlementAmount.toFixed(0)}` : `${who} (${Math.abs(calc.varianceMeters).toFixed(1)}m — add fabric rate for ₹)`;
          } else if (calc) settlementText = "On standard, no settlement";
          return `<tr><td>${p.sentDate}</td><td>${m?m.name:"—"}</td><td>${p.printer||"—"}</td><td class="mono">${p.sentQty}</td>
          <td class="mono">${p.returnedQty||0}</td>
          <td class="mono">${calc ? calc.actualPct.toFixed(1)+"% / "+calc.standardPct+"%" : "—"}</td>
          <td>${settlementText}</td>
          <td class="mono">${p.printIssueQty||0}</td><td class="mono">${p.damageQty||0}</td>
          <td>${done?'<span class="badge ok">Returned</span>':'<span class="badge wait">At printer</span>'}</td>
          <td class="row-actions"><button class="btn small" data-open="printing-edit" data-id="${p.id}">Update</button><button class="btn small danger" data-del="printing" data-id="${p.id}">Cancel</button></td></tr>`;
        }).join("")}
      </table>`}
    </div>
  `;
}

// ---------- Stock ----------
function renderStock(){
  const packedTotal = state.press.filter(p=>!p.cancelled).reduce((s,p)=> s + Math.max(0, Number(p.returnedQty)||0), 0);
  const dispatchedTotal = state.dispatches.filter(d=>!d.cancelled).reduce((s,d)=> s + Number(d.qty||0), 0);
  const restockedTotal = state.returns.filter(r=>!r.cancelled && r.resolution==="restock").reduce((s,r)=>s+Number(r.qty||0),0);
  const readyToDispatch = Math.max(0, packedTotal - dispatchedTotal + restockedTotal);
  const byDest = { "Amazon.in":0, "Amazon.com":0, "Myntra":0 };
  state.dispatches.filter(d=>!d.cancelled).forEach(d=>{ byDest[d.destination] = (byDest[d.destination]||0) + Number(d.qty||0); });
  return `
    <div class="toprow"><h1>Stock</h1><button class="btn primary" data-open="dispatch-new">Record dispatch</button></div>
    <p class="note">Office/Printer/Karigar/Press stages are already tracked in their own tabs (pending quantities show there and on the Dashboard). This tab tracks what's ready and what's been sent out to each marketplace — this running total is also what you compare against Amazon/Myntra's own reported stock to catch any mismatch. Restocked returns (Returns/RTO tab) are added back here automatically.</p>
    <div class="stats" style="margin-bottom:10px">
      <div class="stat"><div class="label">Ready to dispatch (packed, not yet sent)</div><div class="value mono">${readyToDispatch}</div></div>
      <div class="stat"><div class="label">Amazon.in stock (sent)</div><div class="value mono">${byDest["Amazon.in"]}</div></div>
      <div class="stat"><div class="label">Amazon.com stock (sent)</div><div class="value mono">${byDest["Amazon.com"]}</div></div>
      <div class="stat"><div class="label">Myntra stock (sent)</div><div class="value mono">${byDest["Myntra"]}</div></div>
    </div>
    <h2>Dispatch history</h2>
    <div class="panel">
      ${state.dispatches.filter(d=>!d.cancelled).length===0 ? `<div class="empty">No dispatches recorded yet.</div>` :
      `<table>
        <tr><th>Date</th><th>Design</th><th>Qty (pieces)</th><th>Boxes</th><th>Destination</th><th></th></tr>
        ${state.dispatches.filter(d=>!d.cancelled).slice().reverse().map(d=>{
          const design = state.designs.find(x=>x.id===d.designId);
          return `<tr><td>${d.date}</td><td>${design?design.code:"—"}</td><td class="mono">${d.qty}</td><td class="mono">${d.boxes||"—"}</td><td>${d.destination}</td>
          <td class="row-actions"><button class="btn small danger" data-del="dispatch" data-id="${d.id}">Cancel</button></td></tr>`;
        }).join("")}
      </table>`}
    </div>
  `;
}

// ---------- Accounts (owner-only) ----------
function renderAccounts(){
  const totalKarigarPaid = state.karigarPayments.filter(p=>!p.cancelled).reduce((s,p)=>s+Number(p.amount||0),0);
  const totalStaffPaid = state.staffPayments.filter(p=>!p.cancelled).reduce((s,p)=>s+Number(p.amount||0),0);
  const totalSampleCost = state.designs.reduce((s,d)=>s+Number(d.sampleCost||0),0);
  const totalShootCost = state.designs.reduce((s,d)=>s+Number(d.shootCost||0),0);
  return `
    <h1>Accounts</h1>
    <p class="note">This tab is now hidden from employee-role users in the app menu itself. Full GST invoicing, ledgers, and financial-year reports are part of a later phase. What's below is a starting point: karigar and staff payments, plus one-time design costs.</p>
    <div class="stats">
      <div class="stat"><div class="label">Total paid to karigars</div><div class="value mono">₹${totalKarigarPaid.toFixed(0)}</div></div>
      <div class="stat"><div class="label">Total staff salary paid</div><div class="value mono">₹${totalStaffPaid.toFixed(0)}</div></div>
      <div class="stat"><div class="label">Total sample-making cost</div><div class="value mono">₹${totalSampleCost.toFixed(0)}</div></div>
      <div class="stat"><div class="label">Total photoshoot/video cost</div><div class="value mono">₹${totalShootCost.toFixed(0)}</div></div>
    </div>

    <h2>GST liability estimate (India sales only)</h2>
    <p class="note">Rough estimate based on dispatch quantity × design's selling price × GST %, for Amazon.in and Myntra dispatches (exports on Amazon.com are usually zero-rated, so left out). This is a starting estimate, not a filing-ready GST return.</p>
    <div class="panel">
      ${(() => {
        const inrDispatches = state.dispatches.filter(d=>!d.cancelled && (d.destination==="Amazon.in"||d.destination==="Myntra"));
        const rows = inrDispatches.map(d=>{
          const design = state.designs.find(x=>x.id===d.designId);
          if (!design) return null;
          const price = d.destination==="Myntra" ? Number(design.priceMyntra||0) : Number(design.priceIn||0);
          const gstPct = design.gstPercent!=null ? Number(design.gstPercent) : 5;
          const saleValue = price * Number(d.qty||0);
          const gstAmount = saleValue * gstPct/100;
          return { code: design.code, destination: d.destination, qty: d.qty, saleValue, gstPct, gstAmount };
        }).filter(Boolean);
        const totalGst = rows.reduce((s,r)=>s+r.gstAmount,0);
        const totalSales = rows.reduce((s,r)=>s+r.saleValue,0);
        if (rows.length===0) return `<div class="empty">No India dispatches recorded yet.</div>`;
        return `<table>
          <tr><th>Design</th><th>Destination</th><th>Qty</th><th>Sale value</th><th>GST %</th><th>GST amount</th></tr>
          ${rows.map(r=>`<tr><td>${r.code}</td><td>${r.destination}</td><td class="mono">${r.qty}</td><td class="mono">₹${r.saleValue.toFixed(0)}</td><td class="mono">${r.gstPct}%</td><td class="mono">₹${r.gstAmount.toFixed(0)}</td></tr>`).join("")}
          <tr><td colspan="3"><b>Total</b></td><td class="mono"><b>₹${totalSales.toFixed(0)}</b></td><td></td><td class="mono"><b>₹${totalGst.toFixed(0)}</b></td></tr>
        </table>`;
      })()}
    </div>

    <h2>Supplier payables</h2>
    <div class="panel">
      ${state.suppliers.length===0 ? `<div class="empty">No suppliers added yet — add them from the Suppliers tab.</div>` :
      `<table>
        <tr><th>Supplier</th><th>Total purchased</th><th>Total paid</th><th>Balance due</th></tr>
        ${state.suppliers.map(s=>`<tr><td>${s.name}</td><td class="mono">₹${totalPurchasedFromSupplier(s.id).toFixed(0)}</td><td class="mono">₹${totalPaidToSupplier(s.id).toFixed(0)}</td><td class="mono">₹${supplierBalanceDue(s.id).toFixed(0)}</td></tr>`).join("")}
        <tr><td><b>Total</b></td><td></td><td></td><td class="mono"><b>₹${state.suppliers.reduce((s,x)=>s+supplierBalanceDue(x.id),0).toFixed(0)}</b></td></tr>
      </table>`}
    </div>

    <h2>Design profitability</h2>
    <p class="note">Fabric, printing, and press/packing costs are the estimates you entered per design (transaction-level tracing across shared cutting lays and printing trips isn't reliable enough to automate yet). Stitching cost is calculated automatically from actual karigar records. Commission is applied as your entered % of the selling price.</p>
    <div class="panel">
      ${state.designs.filter(d=>d.status!=="draft"&&d.status!=="rejected").length===0 ? `<div class="empty">No active designs yet.</div>` :
      `<table>
        <tr><th>Design</th><th>Cost/piece (fabric+print+press+stitch)</th><th>Amazon.in profit/piece</th><th>Amazon.com profit/piece</th><th>Myntra profit/piece</th></tr>
        ${state.designs.filter(d=>d.status!=="draft"&&d.status!=="rejected").map(d=>{
          const p = designProfitability(d);
          const fmt = (r,symbol) => r ? `${symbol}${r.profit.toFixed(2)} (${r.marginPct.toFixed(0)}%)` : "—";
          return `<tr><td>${d.code}</td>
          <td class="mono">₹${p.costPerPiece.toFixed(2)}${!p.hasStitchData?' <span class="note">(no karigar data yet)</span>':''}</td>
          <td class="mono">${fmt(p.in,"₹")}</td><td class="mono">${fmt(p.com,"$")}</td><td class="mono">${fmt(p.myntra,"₹")}</td></tr>`;
        }).join("")}
      </table>`}
    </div>

    <div class="toprow"><h2>Staff &amp; salaries</h2><div class="row-actions"><button class="btn" data-open="staffpayment-new">Record salary payment</button><button class="btn primary" data-open="staff-new">Add staff member</button></div></div>
    <div class="panel">
      ${state.staff.length===0 ? `<div class="empty">No staff added yet — add master ji, cutting/QC staff, packing staff etc.</div>` :
      `<table>
        <tr><th>Name</th><th>Role</th><th>Monthly salary</th><th>Paid so far</th><th></th></tr>
        ${state.staff.map(s=>{
          const paid = state.staffPayments.filter(p=>p.staffId===s.id && !p.cancelled).reduce((sum,p)=>sum+Number(p.amount||0),0);
          return `<tr><td>${s.name}</td><td>${s.role}</td><td class="mono">₹${s.monthlySalary}</td><td class="mono">₹${paid.toFixed(0)}</td>
          <td class="row-actions"><button class="btn small" data-open="staff-edit" data-id="${s.id}">Edit</button><button class="btn small danger" data-del="staff" data-id="${s.id}">Delete</button></td></tr>`;
        }).join("")}
      </table>`}
    </div>

    <h2>Salary payments made</h2>
    <div class="panel">
      ${state.staffPayments.filter(p=>!p.cancelled).length===0 ? `<div class="empty">No salary payments recorded yet.</div>` :
      `<table>
        <tr><th>Date</th><th>Staff</th><th>Amount</th><th>Note</th><th></th></tr>
        ${state.staffPayments.filter(p=>!p.cancelled).slice().reverse().map(p=>{
          const s = state.staff.find(x=>x.id===p.staffId);

          <td class="row-actions"><button class="btn small danger" data-del="staffpayment" data-id="${p.id}">Cancel</button></td></tr>`;
        }).join("")}
      </table>`}
    </div>

    <h2>Design one-time costs</h2>
    <div class="panel">
      ${state.designs.length===0 ? `<div class="empty">No designs added yet.</div>` :
      `<table>
        <tr><th>Design</th><th>Status</th><th>Sample-making cost</th><th>Photoshoot/video cost</th></tr>
        ${state.designs.map(d=>{
          const statusLabel = d.status==="draft" ? "Draft" : d.status==="rejected" ? "Rejected (bill as attempted, not produced)" : "Active";
          return `<tr><td>${d.code}</td><td>${statusLabel}</td><td class="mono">₹${d.sampleCost||0}</td><td class="mono">₹${d.shootCost||0}</td></tr>`;
        }).join("")}
      </table>`}

  `;
}

// ---------- Audit Log (owner-only) ----------
function renderAuditLog(){
  const rows = [];
  state.batches.filter(x=>x.cancelled).forEach(x=>{ const k=state.karigars.find(k=>k.id===x.karigarId); rows.push({type:"Karigar batch", detail:`${x.batchLabel} — ${k?k.name:"—"}, given ${x.givenQty}`, at:x.cancelledAt}); });
  state.press.filter(x=>x.cancelled).forEach(x=>{ const d=state.designs.find(d=>d.id===x.designId); rows.push({type:"Press entry", detail:`${d?d.code:"—"} — sent ${x.sentQty}`, at:x.cancelledAt}); });
  state.printing.filter(x=>x.cancelled).forEach(x=>{ rows.push({type:"Printing entry", detail:`${x.printer||"—"} — sent ${x.sentQty}m`, at:x.cancelledAt}); });
  state.karigarPayments.filter(x=>x.cancelled).forEach(x=>{ const k=state.karigars.find(k=>k.id===x.karigarId); rows.push({type:"Karigar payment", detail:`${k?k.name:"—"} — ₹${x.amount}`, at:x.cancelledAt}); });
  state.staffPayments.filter(x=>x.cancelled).forEach(x=>{ const s=state.staff.find(s=>s.id===x.staffId); rows.push({type:"Staff payment", detail:`${s?s.name:"—"} — ₹${x.amount}`, at:x.cancelledAt}); });
  state.dispatches.filter(x=>x.cancelled).forEach(x=>{ const d=state.designs.find(d=>d.id===x.designId); rows.push({type:"Dispatch", detail:`${d?d.code:"—"} — ${x.qty} pieces to ${x.destination}`, at:x.cancelledAt}); });
  rows.sort((a,b)=> (b.at||"").localeCompare(a.at||""));
  return `
    <h1>Audit Log</h1>
    <p class="note">This is hidden from employee-role users in the app menu. Cancelled/financial entries are never permanently deleted — cancelling one keeps the original record here, with when it was cancelled, so nothing disappears without a trace.</p>
    <div class="panel">
      ${rows.length===0 ? `<div class="empty">No cancelled entries yet.</div>` :
      `<table><tr><th>Type</th><th>Detail</th><th>Cancelled at</th></tr>
      ${rows.map(r=>`<tr><td>${r.type}</td><td>${r.detail}</td><td class="mono">${r.at ? new Date(r.at).toLocaleString() : "—"}</td></tr>`).join("")}
      </table>`}
    </div>
  `;
}

  `, () => {

    const billedInput = document.getElementById("mat-billedqty");

    const note = document.getElementById("mat-actual-note");
    function updateNote(){
      const ft = state.fabricTypes.find(f=>f.id===fabricTypeSel.value);
      const billed = Number(billedInput.value)||0;
      const actual = ft ? (billed*ft.foldPercent/100) : billed;
      note.textContent = `Actual usable quantity: ${actual.toFixed(2)} meters (${ft?ft.foldPercent:100}% of billed).`;

    if (typeSel) {
      typeSel.onchange = ()=>{
        const isFab = typeSel.value==="Fabric";
        fabricFields.style.display = isFab? "block":"none";
        qtyFields.style.display = isFab? "none":"grid";
      };

    if (billedInput) billedInput.oninput = updateNote;
    if (fabricTypeSel) fabricTypeSel.onchange = updateNote;
    updateNote();

      e.preventDefault();
      const fd = new FormData(form);

      if (obj.type==="Fabric"){
        obj.billedQty = Number(obj.billedQty)||0;
        const ft = state.fabricTypes.find(f=>f.id===obj.fabricTypeId);
        const foldPct = ft ? ft.foldPercent : 100;
        obj.qty = +(obj.billedQty*foldPct/100).toFixed(2);
      } else {
        obj.qty = Number(obj.qty)||0;
        delete obj.billedQty; delete obj.fabricTypeId;
      }
      const fileInput = document.getElementById("mat-billphoto");
      const finish = async (billPhotoUrl) => {
        if (billPhotoUrl) obj.billPhotoUrl = billPhotoUrl;
        else if (isEdit && m.billPhotoUrl) obj.billPhotoUrl = m.billPhotoUrl;
        try{
          if (isEdit){
            const row = await dbUpdate("material", modal.data, obj);
            Object.assign(state.materials.find(x=>x.id===modal.data), row);
          } else {
            const row = await dbInsert("material", obj);
            state.materials.push(row);
          }
          closeModal();
        } catch(err){ alert("Save nahi ho paya, dobara try karein.\\n\\n"+(err.message||err)); }
      };
      if (fileInput && fileInput.files && fileInput.files[0]){
        const reader = new FileReader();
        reader.onload = () => finish(reader.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else finish(null);
    };
  });
}

    <h2>${isEdit?"Update":"Send fabric to"} printer</h2>
    <form id="f-printing">
      <div class="panel" style="padding:14px;margin-bottom:4px">
        <h2 style="margin-bottom:8px">Work out how much to send (optional)</h2>

      <p class="note">Fill the fields below once fabric comes back from the printer. Shrinkage % and settlement are calculated automatically.</p>
      <div class="grid2">
        <label class="field">Returned date<input name="returnedDate" type="date" value="${p.returnedDate||""}"></label>
        <label class="field">Returned qty (actual meters)<input name="returnedQty" id="print-returnedqty" type="number" step="0.01" value="${p.returnedQty||""}"></label>
      </div>
      <div class="panel" style="padding:12px 14px;margin:4px 0" id="print-shrinkage-note">—</div>
      <div class="grid2">
        <label class="field">Print quality issue (m)<input name="printIssueQty" type="number" step="0.01" value="${p.printIssueQty||""}"></label>
        <label class="field">Damage (m)<input name="damageQty" type="number" step="0.01" value="${p.damageQty||""}"></label>
      </div>
      <div class="row-actions" style="justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn" data-close="1">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  `, () => {
    const materialSel = document.getElementById("print-material");
    const sentInput = document.getElementById("print-sentqty");
    const returnedInput = document.getElementById("print-returnedqty");
    const note = document.getElementById("print-shrinkage-note");
    const calcDesign = document.getElementById("print-calc-design");
    const calcComponent = document.getElementById("print-calc-component");
    const calcPieces = document.getElementById("print-calc-pieces");
    const calcResult = document.getElementById("print-calc-result");
    const hiddenDesignId = document.getElementById("print-designid");
    const hiddenComponent = document.getElementById("print-component-hidden");
    const hiddenPieces = document.getElementById("print-pieces-hidden");

    function refreshComponents(){
      const design = state.designs.find(d=>d.id===calcDesign.value);
      const comps = design ? (design.components||[]) : [];
      calcComponent.innerHTML = comps.map(c=>`<option value="${c.name}" ${p.component===c.name?"selected":""}>${c.name}</option>`).join("");
    }
    function runCalc(){
      hiddenDesignId.value = calcDesign.value;
      hiddenComponent.value = calcComponent.value;
      hiddenPieces.value = calcPieces.value;
      const design = state.designs.find(d=>d.id===calcDesign.value);
      const pieces = Number(calcPieces.value)||0;
      if (!design || !calcComponent.value || pieces<=0){ calcResult.textContent = ""; return; }
      const comp = (design.components||[]).find(c=>c.name===calcComponent.value);
      if (!comp){ calcResult.textContent = ""; return; }
      const r = reverseFabricNeeded(comp, pieces);
      calcResult.innerHTML = `Send to printer: <b>${r.afterShrink.toFixed(1)} m</b> (billed/purchase equivalent: ${r.billedNeeded.toFixed(1)} m).`;
      sentInput.value = r.afterShrink.toFixed(1);
      updateNote();
    }
    function updateNote(){
      const calc = computeShrinkage(materialSel.value, sentInput.value, returnedInput.value);
      if (!calc || !returnedInput.value){ note.innerHTML = "Enter sent and returned quantity to see shrinkage and settlement."; return; }
      let settleLine;
      if (calc.owedBy==="none") settleLine = "Right on the standard — no settlement needed.";
      else {
        const who = calc.owedBy==="business" ? "We owe the printer" : "The printer owes us";
        settleLine = calc.settlementAmount!=null
          ? `${who} <b>₹${calc.settlementAmount.toFixed(0)}</b> (${Math.abs(calc.varianceMeters).toFixed(1)}m difference)`
          : `${who} for a difference of <b>${Math.abs(calc.varianceMeters).toFixed(1)} meters</b> (add a rate to this fabric in Materials to see this in ₹)`;
      }
      note.innerHTML = `Actual shrinkage: <b>${calc.actualPct.toFixed(1)}%</b> vs standard <b>${calc.standardPct}%</b> for this fabric.<br>${settleLine}`;
    }
    refreshComponents();
    calcDesign.onchange = ()=>{ refreshComponents(); runCalc(); };
    calcComponent.onchange = runCalc;
    calcPieces.oninput = runCalc;
    materialSel.onchange = updateNote;
    sentInput.oninput = updateNote;
    returnedInput.oninput = updateNote;
    updateNote();

    const form = document.getElementById("f-printing");
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const obj = Object.fromEntries(fd.entries());
      ["sentQty","returnedQty","printIssueQty","damageQty","piecesNeeded"].forEach(k=> obj[k]=obj[k]===""?"":Number(obj[k]));
      if (obj.returnedQty && obj.sentQty && Number(obj.returnedQty) > Number(obj.sentQty)){
        alert("Returned quantity can't be more than sent quantity. Please check the numbers.");
        return;
      }
      delete obj.piecesNeeded;
      try{
        if (isEdit){
          const row = await dbUpdate("printing", modal.data, obj);
          Object.assign(state.printing.find(x=>x.id===modal.data), row);
        } else {
          const row = await dbInsert("printing", obj);
          state.printing.push(row);
        }
        const mat = state.materials.find(x=>x.id===obj.materialId);
        if (mat){
          const newLocation = (obj.returnedQty && Number(obj.returnedQty)>0) ? "Office" : "Printer";
          if (mat.location !== newLocation){
            const updated = await dbUpdate("material", mat.id, { location: newLocation });
            Object.assign(mat, updated);
          }
        }
        closeModal();
      } catch(err){ alert("Save nahi ho paya, dobara try karein.\\n\\n"+(err.message||err)); }
    };
  });
}

    <h2>${isEdit?"Update":"Assign"} batch</h2>

      <div class="grid2">
        <label class="field">Design<select name="designId" id="batch-design">${state.designs.map(d=>`<option value="${d.id}" ${b.designId===d.id?"selected":""}>${d.code}</option>`).join("")}</select></label>

function exportToExcel(){
  try{
    const wb = XLSX.utils.book_new();
    const flat = (arr) => arr.map(row=>{
      const r = {...row};
      if (r.components) r.components = JSON.stringify(r.components);
      if (r.sizeBreakdown) r.sizeBreakdown = JSON.stringify(r.sizeBreakdown);
      return r;
    });
    const addSheet = (name, arr) => { if (!arr || !arr.length) return; XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flat(arr)), name.slice(0,31)); };
    addSheet("Materials", state.materials);
    addSheet("Designs", state.designs);
    addSheet("Printing", state.printing);
    addSheet("Cutting", state.cutting);
    addSheet("Karigars", state.karigars);
    addSheet("Batches", state.batches);
    addSheet("KarigarPayments", state.karigarPayments);
    addSheet("Press", state.press);
    addSheet("Dispatches", state.dispatches);
    addSheet("Staff", state.staff);
    addSheet("StaffPayments", state.staffPayments);
    addSheet("Suppliers", state.suppliers);
    addSheet("SupplierPayments", state.supplierPayments);
    addSheet("Returns", state.returns);
    addSheet("FabricTypes", state.fabricTypes);
    XLSX.writeFile(wb, `aradhika-export-${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch(err){
    alert("Excel export nahi ho paya.\n\n"+(err.message||err));
  }
}

function wrap(inner, afterRender){
  setTimeout(()=>{ if (afterRender) afterRender(); }, 0);
  return `<div class="overlay" id="overlay"><div class="modal">${inner}</div></div>`;
}

// ---------- event wiring ----------
function attachHandlers(){
  document.querySelectorAll("[data-nav]").forEach(el=> el.onclick = ()=> setTab(el.dataset.nav));
  const hamburgerBtn = document.getElementById("btn-hamburger");
  if (hamburgerBtn) hamburgerBtn.onclick = ()=>{ mobileMenuOpen = !mobileMenuOpen; render(); };
  const backdrop = document.getElementById("mobile-backdrop");
  if (backdrop) backdrop.onclick = ()=>{ mobileMenuOpen = false; render(); };
  const backupBtn = document.getElementById("btn-backup");
  if (backupBtn) backupBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `aradhika-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const exportBtn = document.getElementById("btn-export-excel");
  if (exportBtn) exportBtn.onclick = () => exportToExcel();
  const signoutBtn = document.getElementById("btn-signout");
  if (signoutBtn) signoutBtn.onclick = async ()=>{ await sb.auth.signOut(); };
  document.querySelectorAll("[data-view-photo]").forEach(el=> el.onclick = ()=>{
    const mat = state.materials.find(x=>x.id===el.dataset.viewPhoto);
    if (mat && mat.billPhotoUrl){ const w = window.open(); w.document.write(`<img src="${mat.billPhotoUrl}" style="max-width:100%">`); }
  });
  document.querySelectorAll("[data-open]").forEach(el=> el.onclick = ()=> openModal(el.dataset.open, el.dataset.id || el.dataset.loc));
  document.querySelectorAll("[data-close]").forEach(el=> el.onclick = closeModal);
  document.querySelectorAll("[data-del]").forEach(el=> el.onclick = async ()=> {
    const kind = el.dataset.del, id = el.dataset.id;
    const softDeleteKinds = ["batch","press","printing","karigarpayment","staffpayment","dispatch","supplierpayment","return"];
    try{
      if (softDeleteKinds.includes(kind)){
        if (!confirm("This will be marked as cancelled and kept in the audit log, not permanently deleted. Continue?")) return;
        const row = await dbCancel(kind, id);
        const map = { batch:"batches", press:"press", printing:"printing", karigarpayment:"karigarPayments", staffpayment:"staffPayments", dispatch:"dispatches", supplierpayment:"supplierPayments", return:"returns" };
        const item = state[map[kind]].find(x=>x.id===id);
        if (item) Object.assign(item, row);
      } else {
        if (!confirm("This will permanently delete the record. Continue?")) return;
        await dbDelete(kind, id);
        if (kind==="material") state.materials = state.materials.filter(x=>x.id!==id);
        if (kind==="design") state.designs = state.designs.filter(x=>x.id!==id);
        if (kind==="karigar") state.karigars = state.karigars.filter(x=>x.id!==id);
        if (kind==="staff") state.staff = state.staff.filter(x=>x.id!==id);
        if (kind==="supplier") state.suppliers = state.suppliers.filter(x=>x.id!==id);
      }
      render();
    } catch(err){ alert("Yeh action nahi ho paya, dobara try karein.\\n\\n"+(err.message||err)); }
  });
  const overlay = document.getElementById("overlay");
  if (overlay) overlay.addEventListener("mousedown", (e)=>{ if (e.target.id==="overlay") closeModal(); });

  if (modal) {
    if (modal.type==="design-new"||modal.type==="design-edit") document.getElementById("add-comp").onclick = ()=>{ window.__tempComponents.push({name:"",avgConsumption:""}); renderCompRows(); };
    const form = document.querySelector(".modal form");
    if (form) form.onsubmit = (e)=>{ e.preventDefault(); submitForm(new FormData(form)); };
  }
}

async function submitForm(fd){
  const t = modal.type;
  try {
    if (t==="design-new"||t==="design-edit"){
      const obj = Object.fromEntries(fd.entries());
      obj.hasColor = obj.hasColor==="yes";
      obj.gstPercent = obj.gstPercent===""?null:Number(obj.gstPercent);
      obj.components = window.__tempComponents.filter(c=>c.name && c.name.trim());
      if (t==="design-edit"){
        const row = await dbUpdate("design", modal.data, obj);
        Object.assign(state.designs.find(x=>x.id===modal.data), row);
      } else {
        const row = await dbInsert("design", obj);
        state.designs.push(row);
      }
    }
    else if (t==="cutting-new"){
      const obj = Object.fromEntries(fd.entries());
      const sizeBreakdown = {};
      SIZES.forEach(s=>{ if (obj["size_"+s]) sizeBreakdown[s]=Number(obj["size_"+s]); });
      const sizeSum = Object.values(sizeBreakdown).reduce((a,b)=>a+b,0);
      const totalPieces = Number(obj.totalPieces)||0;
      if (sizeSum>0 && sizeSum!==totalPieces){
        if (!confirm(`Size-wise pieces add up to ${sizeSum}, but total pieces entered is ${totalPieces}. Save anyway?`)) return;
      }
      const payload = { designId:obj.designId, materialId:obj.materialId||"", date:obj.date, meterUsed:Number(obj.meterUsed), totalPieces, sizeBreakdown, accessoryMaterialId: obj.accessoryMaterialId||"", accessoryQty: obj.accessoryQty?Number(obj.accessoryQty):"" };
      const row = await dbInsert("cutting", payload);
      state.cutting.push(row);
      if (obj.materialId){
        const mat = state.materials.find(x=>x.id===obj.materialId);
        if (mat){
          const newQty = +(Number(mat.qty) - Number(obj.meterUsed)).toFixed(2);
          const updated = await dbUpdate("material", mat.id, { qty: newQty });
          Object.assign(mat, updated);
        }
      }
      if (obj.accessoryMaterialId && obj.accessoryQty){
        const acc = state.materials.find(x=>x.id===obj.accessoryMaterialId);
        if (acc){
          const newQty = +(Number(acc.qty) - Number(obj.accessoryQty)).toFixed(2);
          const updated = await dbUpdate("material", acc.id, { qty: newQty });
          Object.assign(acc, updated);
        }
      }
    }
    else if (t==="staff-new"||t==="staff-edit"){
      const obj = Object.fromEntries(fd.entries());
      obj.monthlySalary = Number(obj.monthlySalary)||0;
      if (t==="staff-edit"){ const row = await dbUpdate("staff", modal.data, obj); Object.assign(state.staff.find(x=>x.id===modal.data), row); }
      else { const row = await dbInsert("staff", obj); state.staff.push(row); }
    }
    else if (t==="staffpayment-new"){
      const obj = Object.fromEntries(fd.entries());
      obj.amount = Number(obj.amount)||0;
      const row = await dbInsert("staffpayment", obj);
      state.staffPayments.push(row);
    }
    else if (t==="karigarpayment-new"){
      const obj = Object.fromEntries(fd.entries());
      obj.amount = Number(obj.amount)||0;
      const row = await dbInsert("karigarpayment", obj);
      state.karigarPayments.push(row);
    }
    else if (t==="karigar-new"||t==="karigar-edit"){
      const obj = Object.fromEntries(fd.entries());
      obj.rate = Number(obj.rate)||0; obj.advance = Number(obj.advance)||0;
      if (t==="karigar-edit"){ const row = await dbUpdate("karigar", modal.data, obj); Object.assign(state.karigars.find(x=>x.id===modal.data), row); }
      else { const row = await dbInsert("karigar", obj); state.karigars.push(row); }
    }
    else if (t==="batch-new"||t==="batch-edit"){
      const obj = Object.fromEntries(fd.entries());
      ["givenQty","receivedQty","notOkQty"].forEach(k=> obj[k]=Number(obj[k])||0);
      if (obj.receivedQty > obj.givenQty){ alert("Received quantity can't be more than given quantity. Please check the numbers."); return; }
      if (obj.notOkQty > obj.receivedQty){ alert("Not-OK quantity can't be more than received quantity. Please check the numbers."); return; }
      if (t==="batch-edit"){ const row = await dbUpdate("batch", modal.data, obj); Object.assign(state.batches.find(x=>x.id===modal.data), row); }
      else { const row = await dbInsert("batch", obj); state.batches.push(row); }
    }
    else if (t==="press-new"||t==="press-edit"){
      const obj = Object.fromEntries(fd.entries());
      obj.sentQty = Number(obj.sentQty)||0; obj.returnedQty = Number(obj.returnedQty)||0;
      if (obj.returnedQty > obj.sentQty){ alert("Returned quantity can't be more than sent quantity. Please check the numbers."); return; }
      if (t==="press-edit"){ const row = await dbUpdate("press", modal.data, obj); Object.assign(state.press.find(x=>x.id===modal.data), row); }
      else { const row = await dbInsert("press", obj); state.press.push(row); }
    }
    else if (t==="dispatch-new"){
      const obj = Object.fromEntries(fd.entries());
      obj.qty = Number(obj.qty)||0; obj.boxes = obj.boxes? Number(obj.boxes) : "";
      const row = await dbInsert("dispatch", obj);
      state.dispatches.push(row);
    }
    else if (t==="supplier-new"||t==="supplier-edit"){
      const obj = Object.fromEntries(fd.entries());
      if (t==="supplier-edit"){ const row = await dbUpdate("supplier", modal.data, obj); Object.assign(state.suppliers.find(x=>x.id===modal.data), row); }
      else { const row = await dbInsert("supplier", obj); state.suppliers.push(row); }
    }
    else if (t==="supplierpayment-new"){
      const obj = Object.fromEntries(fd.entries());
      obj.amount = Number(obj.amount)||0;
      const row = await dbInsert("supplierpayment", obj);
      state.supplierPayments.push(row);
    }
    else if (t==="return-new"||t==="return-edit"){
      const obj = Object.fromEntries(fd.entries());
      obj.qty = Number(obj.qty)||0;
      if (t==="return-edit"){ const row = await dbUpdate("return", modal.data, obj); Object.assign(state.returns.find(x=>x.id===modal.data), row); }
      else { const row = await dbInsert("return", obj); state.returns.push(row); }
    }
    closeModal();
  } catch(err){
    alert("Save nahi ho paya, dobara try karein.\n\n"+(err.message||err));
  }
}

function renderLogin(){
  document.getElementById("root").innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
      <div class="modal" style="width:360px">
        <div class="brand" style="padding:0 0 10px;border:none;color:var(--ink)">Aradhika<small style="color:var(--muted)">Production &amp; stock manager</small></div>
        <p class="note" style="margin-top:0">Apna email aur password daalein.</p>
        <form id="f-login">
          <label class="field">Email<input name="email" type="email" required autocomplete="username"></label>
          <label class="field" style="margin-top:8px">Password<input name="password" type="password" required autocomplete="current-password"></label>
          ${loginError ? `<p class="note" style="color:var(--madder)">${loginError}</p>` : ""}
          <div class="row-actions" style="justify-content:flex-end;margin-top:14px">
            <button type="submit" class="btn primary" style="width:100%">Login</button>
          </div>
        </form>
        <p class="note" style="margin-top:10px">Naya user chahiye? Owner Supabase dashboard se add karwayenge.</p>
      </div>
    </div>
  `;
  const form = document.getElementById("f-login");
  form.onsubmit = async (e)=>{
    e.preventDefault();
    loginError = "";
    const fd = new FormData(form);
    const email = fd.get("email"), password = fd.get("password");
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true; submitBtn.textContent = "Logging in...";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error){
      loginError = error.message;
      renderLogin();
    }
  };
}
function renderLoadingScreen(msg){
  document.getElementById("root").innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:'Inter',sans-serif">${msg||"Loading..."}</div>`;
}

async function loadAllFromSupabase(){
  const results = await Promise.all([
    sb.from('fabric_types').select('*').order('name'),
    sb.from('materials').select('*').order('created_at'),
    sb.from('designs').select('*').order('created_at'),
    sb.from('printing').select('*').order('created_at'),
    sb.from('cutting').select('*').order('created_at'),
    sb.from('karigars').select('*').order('created_at'),
    sb.from('batches').select('*').order('created_at'),
    sb.from('karigar_payments').select('*').order('created_at'),
    sb.from('press').select('*').order('created_at'),
    sb.from('dispatches').select('*').order('created_at'),
    sb.from('staff').select('*').order('created_at'),
    sb.from('staff_payments').select('*').order('created_at'),
    sb.from('suppliers').select('*').order('created_at'),
    sb.from('supplier_payments').select('*').order('created_at'),
    sb.from('returns').select('*').order('created_at'),
  ]);
  const [ft, mats, des, prt, cut, kar, bat, kp, prs, disp, stf, sp, sup, supp, ret] = results;
  results.forEach(r=>{ if (r.error) console.error("Load error:", r.error); });
  state.fabricTypes = (ft.data||[]).map(rowToCamel);
  state.materials = (mats.data||[]).map(rowToCamel);
  state.designs = (des.data||[]).map(rowToCamel);
  state.printing = (prt.data||[]).map(rowToCamel);
  state.cutting = (cut.data||[]).map(rowToCamel);
  state.karigars = (kar.data||[]).map(rowToCamel);
  state.batches = (bat.data||[]).map(rowToCamel);
  state.karigarPayments = (kp.data||[]).map(rowToCamel);
  state.press = (prs.data||[]).map(rowToCamel);
  state.dispatches = (disp.data||[]).map(rowToCamel);
  state.staff = (stf.data||[]).map(rowToCamel);
  state.staffPayments = (sp.data||[]).map(rowToCamel);
  state.suppliers = (sup.data||[]).map(rowToCamel);
  state.supplierPayments = (supp.data||[]).map(rowToCamel);
  state.returns = (ret.data||[]).map(rowToCamel);
}

async function onLoggedIn(session){
  currentUser = { id: session.user.id, email: session.user.email };
  renderLoadingScreen("Aapka data load ho raha hai...");
  const { data: profile, error: profErr } = await sb.from('profiles').select('role').eq('id', currentUser.id).single();
  currentRole = (!profErr && profile) ? profile.role : "employee";
  await loadAllFromSupabase();
  activeTab = "dashboard";
  render();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session) onLoggedIn(session);
  if (event === "SIGNED_OUT") { currentUser = null; modal = null; renderLogin(); }
});

(async function boot(){
  renderLoadingScreen("Loading...");
  const { data: { session } } = await sb.auth.getSession();
  if (session) await onLoggedIn(session);
  else renderLogin();
})();
</script>
